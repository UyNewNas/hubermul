name: CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU-only environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Static checks
        run: |
          ruff check --select E9,F .
          python -m compileall -q src experiments tests
      - name: Full tests
        run: python -m pytest -q
      - name: Build and install wheel outside checkout
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python -c 'import torch; from hubermul import huber_mul; assert huber_mul(torch.tensor(1.), torch.tensor(1.)).item() == 1.'
      - name: Paired smoke experiment
        run: python -m experiments.run --config experiments/configs/smoke.toml --output runs/ci-smoke
      - name: Keep experiment records even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-smoke-py${{ matrix.python }}
          path: runs/
          if-no-files-found: ignore
