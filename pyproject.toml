[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubermul"
version = "0.1.0a1"
description = "Experimental Huber-polarized multiplication with bounded input gradients"
requires-python = ">=3.11"
dependencies = ["torch>=2.10"]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8", "mpmath>=1.3"]
dev = ["pytest>=8", "mpmath>=1.3", "ruff>=0.11", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
